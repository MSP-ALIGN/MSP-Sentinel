# MSP Sentinel: Nginx site (written by install/install.sh).
# __DOMAIN__, __ROOT__, __CERT__ and __KEY__ are filled in by the installer.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    server_tokens off;

    # Let's Encrypt HTTP challenges (certbot --webroot).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # "listen ... ssl http2" works on the Nginx in Ubuntu 24.04 (1.24) and Debian 12 (1.22).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;
    server_tokens off;

    ssl_certificate __CERT__;
    ssl_certificate_key __KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:MSPSentinel:10m;
    ssl_session_tickets off;

    root __ROOT__/public;
    index index.php;
    client_max_body_size 4m;
    access_log /var/log/nginx/msp-sentinel.access.log;
    error_log /var/log/nginx/msp-sentinel.error.log;

    # Never serve dotfiles (.git, .env and the like).
    location ~ /\. {
        deny all;
    }

    # Static assets straight from public/assets.
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";
    }

    # Everything else goes to the front controller (the app sets its own security headers).
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        # The API needs the Authorization header (Nginx passes it as HTTP_AUTHORIZATION; set explicitly for clarity).
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass unix:/run/php/msp-sentinel.sock;
        fastcgi_read_timeout 120s;
    }

    # No other PHP file is ever executed.
    location ~ \.php$ {
        return 404;
    }
}
