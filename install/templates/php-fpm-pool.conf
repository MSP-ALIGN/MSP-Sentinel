; MSP Sentinel: PHP-FPM pool (written by install/install.sh).
; Runs as www-data with the "sentinel" group, so it can read the app's files
; (root:sentinel, 0640) and write storage/ (setgid, group-writable), and nothing else of the app.
[msp-sentinel]
user = www-data
group = sentinel
listen = /run/php/msp-sentinel.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 30s
pm.max_requests = 500
php_admin_value[expose_php] = Off
php_admin_value[upload_max_filesize] = 3M
php_admin_value[post_max_size] = 4M
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 120
php_admin_value[session.use_strict_mode] = 1
php_admin_value[error_log] = /var/log/msp-sentinel/php-error.log
php_admin_flag[log_errors] = On
php_admin_flag[display_errors] = Off
