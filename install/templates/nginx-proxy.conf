# MSP Sentinel: Nginx site behind a reverse proxy (written by install/install.sh).
# The proxy handles HTTPS and forwards plain HTTP here. Only the proxy's address (__PROXY__) may connect; the app
# trusts X-Forwarded-For and X-Forwarded-Proto from that address only (app.trusted_proxies in the config).
# __DOMAIN__, __ROOT__ and __PROXY__ are filled in by the installer.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    server_tokens off;

    allow __PROXY__;
    deny all;

    root __ROOT__/public;
    index index.php;
    client_max_body_size 4m;
    access_log /var/log/nginx/msp-sentinel.access.log;
    error_log /var/log/nginx/msp-sentinel.error.log;

    # Never serve dotfiles (.git, .env and the like).
    location ~ /\. {
        deny all;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        # HTTPS is decided by the app from X-Forwarded-Proto (trusted from the proxy only), not set here.
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass unix:/run/php/msp-sentinel.sock;
        fastcgi_read_timeout 120s;
    }

    location ~ \.php$ {
        return 404;
    }
}
