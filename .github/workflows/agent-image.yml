# Publishes the agent's container image to GitHub's registry (ghcr.io/<owner>/msp-sentinel-agent) when a release tag
# (vX.Y.Z) is pushed, or when started by hand from the Actions tab. Nothing runs on ordinary pushes or pull requests.
#
# - Built from docker/agent/Dockerfile for amd64 and arm64, tagged with the version (and "latest" for tags).
# - Signed with Sigstore cosign (keyless, tied to this workflow): check with
#     cosign verify ghcr.io/OWNER/msp-sentinel-agent:VERSION \
#       --certificate-identity-regexp 'https://github.com/OWNER/MSP-Sentinel/.github/workflows/agent-image.yml@refs/tags/v.*' \
#       --certificate-oidc-issuer https://token.actions.githubusercontent.com
# - Only GITHUB_TOKEN is used (packages: write for this repository); no other secrets.
# To turn it off, disable the workflow in the Actions tab.
name: Agent image

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write   # keyless signing

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Version must match the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "VERSION ($v) does not match tag ${GITHUB_REF_NAME}"; exit 1; }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/msp-sentinel-agent
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do cosign sign --yes "${tag}@${DIGEST}"; done
